name: build boot.img

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  KERNEL_BRANCH: LA.UM.10.6.2.c26
  ALPINE_BRANCH: v3.19
  CROSS: arm-linux-gnueabihf-

jobs:
  boot-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf \
            libc6-dev-armhf-cross \
            bison flex bc lzop cpio xz-utils curl

      - name: Build UI binary (static)
        run: |
          ${CROSS}gcc -Os -static -o out-ui initramfs/ui.c

      - name: Clone CAF msm-4.9 kernel
        run: |
          git clone --depth=1 -b "$KERNEL_BRANCH" \
            https://git.codelinaro.org/clo/la/kernel/msm-4.9.git kernel
          # CLO's python2 gcc-wrapper.py breaks on modern runners:
          # replace it with a python3 passthrough honoring $REAL_CC
          cp scripts/gcc-wrapper-py3.py kernel/scripts/gcc-wrapper.py
          chmod +x kernel/scripts/gcc-wrapper.py
          # gcc13 breaks 4.9's cc-option probe -> kbuild falls back to armv5t.
          python3 scripts/fix-march.py kernel/arch/arm/Makefile
          # binutils>=2.41 rejects "#function" in .type/.size
          bash scripts/fix-binutils241.sh kernel
          echo "=== proc-v7.S around line 635 ==="
          sed -n '630,640p' kernel/arch/arm/mm/proc-v7.S | cat -A | head -12 || true
          echo "=== gas section-flag probes ==="
          printf '.section ".t", #alloc\n' > /tmp/p1.s
          printf '.section ".t", %%alloc\n' > /tmp/p2.s
          printf '.section ".t","a"\n' > /tmp/p3.s
          ${CROSS}as -march=armv7-a /tmp/p1.s -o /dev/null 2>&1 && echo P1_HASH_OK || echo P1_HASH_FAIL
          ${CROSS}as -march=armv7-a /tmp/p2.s -o /dev/null 2>&1 && echo P2_PCT_OK || echo P2_PCT_FAIL
          ${CROSS}as -march=armv7-a /tmp/p3.s -o /dev/null 2>&1 && echo P3_QUOTE_OK || echo P3_QUOTE_FAIL

      - name: Toolchain sanity probes
        run: |
          ${CROSS}gcc --version | head -1
          echo 'int main(void){return 0;}' > /tmp/t.c
          ${CROSS}gcc -c /tmp/t.c -o /tmp/t.o && echo PLAIN_COMPILE_OK || echo PLAIN_COMPILE_FAIL
          REAL_CC=$(which ${CROSS}gcc) python3 kernel/scripts/gcc-wrapper.py -c /tmp/t.c -o /tmp/t.o \
            && echo WRAPPER_COMPILE_OK || echo WRAPPER_COMPILE_FAIL

      - name: Kernel config + zImage + DTBs
        run: |
          cd kernel
          cp ../files/kernel_config .config
          export REAL_CC=$(which ${CROSS}gcc)
          make ARCH=arm CROSS_COMPILE="$CROSS" olddefconfig
          echo "=== effective arch/soc symbols ==="
          grep -E "^(# )?CONFIG_(ARCH_MULTI|CPU_V[4-7]|ARCH_QCOM|ARCH_MSM8909|AEABI)" .config || true
          echo "=== sample compile line (init/main.o) ==="
          make ARCH=arm CROSS_COMPILE="$CROSS" V=1 init/main.o 2>&1 | grep -E "gnueabihf-gcc" | head -3 || true
          echo "=== arch Makefile armv5t logic ==="
          grep -n -B4 -A2 "armv5t" arch/arm/Makefile || true
          make ARCH=arm CROSS_COMPILE="$CROSS" -j"$(nproc)" zImage dtbs
          cp arch/arm/boot/zImage ../out-zImage

      - name: Select board DTB
        run: |
          cd kernel/arch/arm/boot/dts
          DTB=$(ls qcom/msm8909-qrd-skub*.dtb 2>/dev/null | head -1)
          [ -z "$DTB" ] && DTB=$(ls qcom/msm8905-qrd-skub*.dtb 2>/dev/null | head -1)
          [ -z "$DTB" ] && DTB=$(ls qcom/msm8909-qrd.dtb 2>/dev/null | head -1)
          [ -n "$DTB" ] || { echo "no board dtb found:"; ls qcom/ | grep 890 ; exit 1; }
          echo "selected $DTB"
          cp "$DTB" "$GITHUB_WORKSPACE/out-board.dtb"

      - name: Bootstrap Alpine rootfs + initramfs
        run: |
          chmod +x scripts/*.sh
          ./scripts/build-initramfs.sh rootfs "$ALPINE_BRANCH" out-ui
          cd rootfs
          find . | cpio -o -H newc --owner 0:0 | gzip -9 > ../out-initramfs.cpio.gz

      - name: Pack boot.img
        run: ./scripts/pack.sh out-zImage out-board.dtb out-initramfs.cpio.gz out/boot.img

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: f320b-boot
          path: |
            out/boot.img
            out-zImage
            out-board.dtb
            out-initramfs.cpio.gz
